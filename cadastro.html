<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/Style_cadastro.css">
        <title>Cadastre-se</title>
    </head>
    <section">
    <body>
<div>
<header>
    <figure id="logo">
  <img id="logo" src="img/icone.png" alt="logo Danado´s">
    </figure>
</header>
</div>
        <div class="cadastro">
            <h3>CADASTRE-SE NA DANADO'S TECH</h3>

        <form action="index.html" method="get">

                <label for="nome">NOME</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
                <br>

                <label for="email">EMAIL</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu Email"
                    required
                >
                <br>

                <label for="senha">SENHA</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
                <br>

                <label for="confirmar">CONFIRME A SUA SENHA</label>
                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Confirmar a sua senha"
                    required
                >
                <br>

            <button type="submit">Cadastrar</button>

            </form>
        </div>

        <script>
            alert("Seja bem-vindo ao nosso site, por favor conclua o cadastro");
        </script>

    </body>
    </section>
</html>
